<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMate | To-Do List Practice Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>

  <main class="todo-wrapper">
    <!-- Navigation Back Link -->
    <div class="top-nav">
      <a href="../../index.html#projects" class="back-link">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Back to Portfolio</span>
      </a>
      <span class="project-pill">College Practice Project 2</span>
    </div>

    <!-- Main Card -->
    <div class="todo-card">
      <div class="card-header">
        <div class="header-left">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <polyline points="9 11 12 14 22 4"></polyline>
            </svg>
          </div>
          <div>
            <h1 class="card-title">TaskMate App</h1>
            <p class="card-subtitle">Organize, Prioritize &amp; Track Daily Tasks</p>
          </div>
        </div>
        <span class="badge">DOM &amp; LocalStorage</span>
      </div>

      <!-- Input Form -->
      <form id="todo-form" class="todo-input-group" novalidate>
        <div class="input-row">
          <input 
            type="text" 
            id="task-input" 
            class="task-input" 
            placeholder="What needs to be done?..." 
            autocomplete="off"
            required
          >
          <select id="priority-select" class="priority-select" aria-label="Task Priority">
            <option value="normal">Normal</option>
            <option value="study">Study</option>
            <option value="urgent">Urgent</option>
          </select>
          <button type="submit" id="add-btn" class="btn btn-add">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add</span>
          </button>
        </div>
        <div id="input-error" class="input-error-msg">Please enter a task description.</div>
      </form>

      <!-- Filter Controls -->
      <div class="todo-controls">
        <div class="filter-tabs" role="tablist">
          <button type="button" class="filter-tab active" data-filter="all">All</button>
          <button type="button" class="filter-tab" data-filter="active">Active</button>
          <button type="button" class="filter-tab" data-filter="completed">Completed</button>
        </div>
        <div class="task-stats">
          <span id="items-left">0 tasks remaining</span>
        </div>
      </div>

      <!-- Task List Container -->
      <div class="todo-list-container">
        <ul id="todo-list" class="todo-list" aria-live="polite">
          <!-- Dynamically populated via script.js -->
        </ul>
        <div id="empty-state" class="empty-state">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
          <p>No tasks yet! Add your first assignment or goal above.</p>
        </div>
      </div>

      <!-- Card Footer Actions -->
      <div class="todo-footer">
        <button type="button" id="clear-completed" class="btn-clear-completed">
          Clear Completed
        </button>
        <span class="footer-note">Saved locally in your browser</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
